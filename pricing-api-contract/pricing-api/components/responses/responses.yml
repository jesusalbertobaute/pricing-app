components:
  responses:
    BadRequestResponse:
      description: The response body when the server returns a Bad Request error.
      content:
        application/json:
          schema:
            $ref: "../schemas/schemas.yml#/components/schemas/Error"
          example: {
                "type": "about:blank",
                "status": 400,
                "title": "Bad Request",
                "detail": "Parameter not found"
          }
    NotFoundResponse:
      description: The response body when the server returns a Not Found error.
      content:
        application/json:
          schema:
            $ref: "../schemas/schemas.yml#/components/schemas/Error"
          example: {
                "type": "about:blank",
                "status": 404,
                "title": "Resource Not Found",
                "detail": "Price Not Found"
          }
    TooManyRequestResponse:
      description: The response body when the server returns a Too Many Requests error.
      content:
        application/json:
          schema:
            $ref: "../schemas/schemas.yml#/components/schemas/Error"
          example: {
                "type": "about:blank",
                "status": 429,
                "title": "Too Many Request",
                "detail": "Too Many Request"
          }
    InternalServerResponse:
      description: The response body when the server returns a Internal Server Error.
      content:
        application/json:
          schema:
            $ref: "../schemas/schemas.yml#/components/schemas/Error"
          example: {
                "type": "about:blank",
                "status": 500,
                "title": "Internal Server Error",
                "detail": "Internal Server Error"
          }
    

