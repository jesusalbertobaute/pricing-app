components:

  schemas:

    ApplicablePrice:
      description: The response body for a successful retrieval of applicable price
      type: object
      required:
        - productId
        - brandId
        - tariffId
        - startDate
        - endDate
        - price
        - currencyCode
      properties:
        productId:
          type: integer
          format: int64
          description: product id
          example: 35455
        brandId:
          type: integer
          format: int32
          description: brand id
          example: 1
        tariffId:
          type: integer
          format: int64
          description: tariff Id
          example: 1
        startDate:
          type: string
          format: date-time
          description: tariff price start date
        endDate:
          type: string
          format: date-time
          description: tariff price end date
        price:
          type: number
          description: final price
          example: 35.50
        currencyCode:
          type: string
          description: ISO Currency Code 
          example: "EUR"

    Error:
      description: A structured error response compliant with the RFC 9457 standard (Problem Details for HTTP APIs).
      type: 'object'
      required:
        - type
        - status
        - title
        - detail
      properties:
        type:
          type: string
          description: 'The unique identifier for the error type. Settled as "about:blank" to indicate that the error is fully defined by the HTTP status code'
        status:
          type: integer
          format: int32
          description: 'The HTTP status code'
        title:
          type: 'string'
          description: 'A short, human-readable summary of the problem type'
        detail:
          type: 'string'
          description: 'A dynamic, contextual explanation of the specific failure'
   
   