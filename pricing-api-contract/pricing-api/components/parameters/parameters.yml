components:

  parameters:

      ApplicationDate:
        in: query
        name: applicationDate
        required: true
        description: It indicates the application date of price. This parameter is required.
        schema:
          type: string
          format: date-time
        example: "2020-06-14T16:00:00"
      
      ProductId:
        in: query
        name: productId
        required: true
        description: It indicates the product id. This parameter is required.
        schema:
          type: integer
          format: int64
        example: 35455
      
      BrandId:
        in: query
        name: brandId
        required: true
        description: It indicates the brand id. This parameter is required.
        schema:
          type: integer
          format: int32
        example: 1
