spring:
  application:
    name: princing-service
  datasource:
    url: jdbc:h2:mem:ecommercedb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/schema.sql
      data-locations:
        - classpath:db/data.sql

springdoc:
  swagger-ui:
    url: /openapi/openapi-rest.yml