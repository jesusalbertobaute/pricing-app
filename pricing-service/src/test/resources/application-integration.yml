spring:
  datasource:
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/schema.sql
      data-locations:
        - classpath:db/data.sql
resilience4j:
  ratelimiter:
    instances:
      getApplicablePriceApiLimiter:
        limit-for-period: 50
        limit-refresh-period: 1s
        timeout-duration: 500ms